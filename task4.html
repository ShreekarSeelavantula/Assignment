<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Function Arguments & Rest Parameter</title>
</head>
<body>

    <h1>Check the Console for Outputs</h1>

    <script>
        function flexibleFunction(a, b, ...rest) {
            console.log("a:", a);
            console.log("b:", b);
            console.log("rest:", rest);
        }

        console.log("Flexible Function Calls:");
        flexibleFunction(1); 
        flexibleFunction(1, 2); 
        flexibleFunction(1, 2, 3, 4, 5); 

        function sumAll(...numbers) {
            return numbers.reduce((sum, current) => sum + current, 0);
        }

        console.log("sumAll Function Calls:");
        console.log(sumAll(1, 2, 3));       
        console.log(sumAll(10, 20, 30, 40)); 
        console.log(sumAll());             

        function processArguments(primaryFunc, ...args) {
            return primaryFunc(...args);
        }

        function multiply(x, y) {
            return x * y;
        }

        console.log("processArguments Function Calls:");
        console.log(processArguments(multiply, 4, 5));      
        console.log(processArguments(Math.max, 1, 3, 7));    
        console.log(processArguments(sumAll, 10, 20, 30));   
    </script>

</body>
</html>
